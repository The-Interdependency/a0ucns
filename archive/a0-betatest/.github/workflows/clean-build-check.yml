name: Clean Build Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  check-replit-refs:
    name: Verify no @replit packages in frontend build output
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install frontend dependencies
        run: npm install --prefix frontend

      - name: Build frontend without REPL_ID
        run: env -u REPL_ID CI=false npm run build --prefix frontend

      - name: Check for @replit references in frontend bundle
        run: |
          MATCHES=$( (grep -r "@replit" frontend/build/static/ || true) )
          if [ -n "$MATCHES" ]; then
            echo "::error::@replit packages leaked into the frontend bundle. Run 'env -u REPL_ID CI=false npm run build --prefix frontend' locally and check frontend imports for static @replit references."
            echo "$MATCHES"
            exit 1
          fi
          echo "Clean build confirmed: zero @replit references in frontend bundle."
