name: Build & Deploy to Cloud Run

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  SERVICE: a0p
  REGISTRY: us-central1-docker.pkg.dev

# Least-privilege default for the whole workflow; the deploy job widens its own
# permissions (id-token: write) below for Google Cloud auth.
permissions:
  contents: read

jobs:
  check-current-layout:
    name: Current layout build smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install frontend dependencies
        run: npm install --prefix frontend

      - name: Build frontend
        run: CI=false npm run build --prefix frontend

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Backend import smoke (startup)
        # py_compile only byte-compiles — it never runs server.py's imports, so an
        # import-time failure in any router (api_training, api_agent_lab,
        # api_tools_mcp_skills, ...) or its deps would slip past. Actually import
        # the app + standalone modules so those failures gate the deploy. Dummy
        # env satisfies the fail-fast startup checks (db/config/server/vault);
        # motor connects lazily, so no live Mongo is needed. Importing server also
        # constructs the agent store at module load, which mkdir's its storage root
        # (default /app/storage/agents — not writable on the runner), so point the
        # storage roots at the runner temp dir.
        working-directory: backend
        env:
          MONGO_URL: mongodb://localhost:27017
          DB_NAME: import_smoke
          JWT_SECRET: ci-import-smoke-not-a-real-secret
          CORS_ORIGINS: http://localhost:3000
          A0P_AGENTS_ROOT: ${{ runner.temp }}/a0p-import-smoke/agents
          A0P_AUDIT_STORAGE_ROOT: ${{ runner.temp }}/a0p-import-smoke/audit
          A0P_TRAFFIC_LOG: ${{ runner.temp }}/a0p-import-smoke/traffic.log
        run: |
          export A0P_KEY_VAULT_SECRET="$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
          python -c "import server, models, living_spec, readme_writer"

  deploy:
    name: Build, push, deploy
    needs: check-current-layout
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Build Docker image
        run: |
          docker build \
            --tag ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.SERVICE }}/${{ env.SERVICE }}:${{ github.sha }} \
            --tag ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.SERVICE }}/${{ env.SERVICE }}:latest \
            .

      - name: Push Docker image
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.SERVICE }}/${{ env.SERVICE }}:${{ github.sha }}
          docker push ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.SERVICE }}/${{ env.SERVICE }}:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --image=${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.SERVICE }}/${{ env.SERVICE }}:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --port=5000 \
            --min-instances=0 \
            --max-instances=10 \
            --memory=512Mi \
            --cpu=1 \
            --set-secrets="DATABASE_URL=a0p-database-url:latest,SESSION_SECRET=a0p-session-secret:latest,XAI_API_KEY=a0p-xai-api-key:latest,STRIPE_SECRET_KEY=a0p-stripe-secret-key:latest,STRIPE_WEBHOOK_SECRET=a0p-stripe-webhook-secret:latest"
